<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charlemos — Gramática Española</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ceramic: #EFE6D5;
    --ceramic-dark: #E2D6BE;
    --cobalt: #1B3B6F;
    --cobalt-deep: #142C54;
    --clay: #B54A2A;
    --gold: #DFA526;
    --ink: #17233A;
    --ok: #3E7A4F;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100vh;
    background: var(--ceramic);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
  }

  body {
    background-image:
      repeating-linear-gradient(45deg, var(--ceramic-dark) 0, var(--ceramic-dark) 1px, transparent 1px, transparent 42px),
      repeating-linear-gradient(-45deg, var(--ceramic-dark) 0, var(--ceramic-dark) 1px, transparent 1px, transparent 42px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .board {
    width: 100%;
    max-width: 560px;
  }

  header {
    text-align: center;
    margin-bottom: 22px;
  }

  header .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--clay);
    font-weight: 700;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 700;
    font-size: 40px;
    margin: 4px 0 2px;
    color: var(--cobalt-deep);
  }

  header p {
    margin: 0;
    font-size: 14px;
    color: #4a5568;
  }

  .stats {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    font-family: 'JetBrains Mono', monospace;
    flex-wrap: wrap;
    gap: 8px;
  }

  .stat {
    background: var(--cobalt);
    color: var(--ceramic);
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    display: flex;
    gap: 8px;
    align-items: baseline;
  }

  .stat b {
    font-size: 17px;
    font-weight: 700;
    color: var(--gold);
  }

  .stat.streak b { color: #ff9d6b; }

  .card {
    background: #fff;
    border-radius: 20px;
    padding: 26px 22px;
    box-shadow: 0 18px 40px -18px rgba(20,44,84,0.45);
    position: relative;
    overflow: hidden;
  }

  .category {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--clay);
    font-weight: 700;
    margin-bottom: 14px;
  }

  /* --- Chat bubble: the question/prompt --- */
  .chat-row {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  .chat-avatar {
    flex: 0 0 auto;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--cobalt);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    margin-top: 2px;
  }
  .bubble {
    position: relative;
    background: var(--ceramic);
    border: 1.5px solid var(--ceramic-dark);
    border-radius: 16px;
    padding: 14px 16px;
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--cobalt-deep);
    line-height: 1.4;
  }
  .bubble .blank-static {
    color: var(--gold);
    border-bottom: 3px solid var(--gold);
  }

  .prompt-sub {
    font-size: 13px;
    color: #6b7280;
    margin: 6px 0 18px 40px;
  }

  .speak-btn {
    background: none;
    border: 1px solid var(--cobalt);
    color: var(--cobalt);
    border-radius: 8px;
    padding: 5px 11px;
    font-size: 12px;
    cursor: pointer;
    font-family: 'Work Sans', sans-serif;
    margin: 0 0 18px 40px;
  }
  .speak-btn:hover { background: var(--cobalt); color: #fff; }

  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 6px;
  }

  .tile {
    position: relative;
    background: var(--ceramic);
    border: 2px solid var(--ceramic-dark);
    border-radius: var(--radius);
    padding: 16px 10px;
    font-size: 17px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    font-family: 'Work Sans', sans-serif;
  }
  .tile:hover:not(:disabled) {
    transform: translateY(-2px);
    border-color: var(--cobalt);
  }
  .tile:disabled { cursor: default; }
  .tile.correct { background: var(--ok); border-color: var(--ok); color: #fff; }
  .tile.wrong { background: var(--clay); border-color: var(--clay); color: #fff; }

  .feedback {
    min-height: 22px;
    margin: 14px 0 4px 40px;
    font-size: 14px;
    font-weight: 500;
  }
  .feedback.ok { color: var(--ok); }
  .feedback.no { color: var(--clay); }
  .feedback .translation {
    display: block;
    margin-top: 4px;
    font-weight: 400;
    color: #6b7280;
    font-style: italic;
  }

  /* --- Answer bubble: tappable phrase chunks, Duolingo-style --- */
  .answer-wrap {
    display: none;
    margin: 10px 0 0 40px;
  }
  .answer-wrap.show { display: block; }
  .answer-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #9b9384;
    margin-bottom: 8px;
  }
  .answer-bubble {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    background: #fff;
    border: 1.5px solid var(--ceramic-dark);
    border-radius: 16px;
    padding: 12px 14px;
  }
  .chunk {
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--ceramic);
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }
  .chunk:hover { border-color: var(--cobalt); }
  .chunk.selected { background: var(--cobalt); color: #fff; }
  .chunk.is-answer { border-color: var(--gold); }
  .chunk.is-answer.selected { background: var(--gold); color: var(--ink); }

  .explain-card {
    display: none;
    margin-top: 12px;
    background: var(--ceramic);
    border: 1.5px dashed var(--ceramic-dark);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .explain-card.show { display: block; }
  .explain-card .lead {
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 4px;
  }
  .explain-card .lead b {
    font-family: 'JetBrains Mono', monospace;
    color: var(--cobalt-deep);
  }
  .explain-card .compare-title {
    margin-top: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--clay);
    font-weight: 700;
  }
  .explain-card ul {
    margin: 6px 0 0;
    padding-left: 18px;
  }
  .explain-card li {
    font-size: 13px;
    line-height: 1.5;
    color: #4a5568;
    margin-bottom: 6px;
  }
  .explain-card li b {
    font-family: 'JetBrains Mono', monospace;
    color: var(--cobalt);
  }

  .next-btn {
    display: block;
    width: 100%;
    margin-top: 18px;
    padding: 12px;
    background: var(--cobalt-deep);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .next-btn.show { opacity: 1; pointer-events: auto; }
  .next-btn:hover { background: var(--cobalt); }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 18px;
  }
  .filter-btn {
    background: #fff;
    border: 1.5px solid var(--ceramic-dark);
    color: var(--ink);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    cursor: pointer;
  }
  .filter-btn.active { background: var(--cobalt); border-color: var(--cobalt); color: #fff; }

  footer {
    text-align: center;
    margin-top: 18px;
    font-size: 12px;
    color: #8a8375;
    font-family: 'JetBrains Mono', monospace;
  }

  @media (max-width: 380px) {
    h1 { font-size: 30px; }
    .bubble { font-size: 17px; }
    .prompt-sub, .speak-btn, .feedback, .answer-wrap { margin-left: 0; }
  }
</style>
</head>
<body>

<div class="board">
  <header>
    <div class="eyebrow">Gramática · Verbos y pronombres</div>
    <h1>Charlemos</h1>
    <p>Answer, then tap any word or phrase in your answer to see why it's used.</p>
  </header>

  <div class="stats">
    <div class="stat">Score <b id="score">0</b></div>
    <div class="stat streak">Streak <b id="streak">0</b></div>
    <div class="stat">Best <b id="best">0</b></div>
  </div>

  <div class="filters" id="filters"></div>

  <div class="card">
    <div class="category" id="category">Category</div>

    <div class="chat-row">
      <div class="chat-avatar">🔊</div>
      <div class="bubble" id="prompt">—</div>
    </div>
    <div class="prompt-sub" id="promptSub"></div>
    <button class="speak-btn" id="speakBtn" type="button">🔊 Hear the sentence</button>

    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>

    <div class="answer-wrap" id="answerWrap">
      <div class="answer-label">Your answer — tap any part</div>
      <div class="answer-bubble" id="answerBubble"></div>
      <div class="explain-card" id="explainCard"></div>
    </div>

    <button class="next-btn" id="nextBtn" type="button">Next sentence →</button>
  </div>

  <footer id="progress">Question 1 of —</footer>
</div>

<script>
const GENERAL_NOTES = {
    "yo": { note: "Subject pronoun for \"I\". Common English-speaker mistake: because English always needs a subject (\"I am\", \"I go\"), learners keep typing \"yo\" in front of every verb out of habit. In Spanish the verb ending already tells you who's acting (\"soy\" can only mean \"I am\"), so \"yo\" is normally dropped and only added for emphasis or contrast.",
      compare: [ { word: "tú", note: "Used instead when speaking to one person informally — the verb ending changes to match." },
                 { word: "nosotros", note: "Used instead when \"we\" (the speaker plus others) share the action — the verb takes a nosotros ending." } ] },
    "tú": { note: "Subject pronoun for \"you\" (informal, singular). Common mistake: English has one word \"you\" for everyone, so English speakers often use \"tú\" with strangers, elders, or bosses without realizing Spanish forces a formality choice that English doesn't have.",
      compare: [ { word: "usted", note: "The formal \"you\" — used with strangers, elders, or in professional settings; takes the same verb form as él/ella." },
                 { word: "vosotros", note: "The informal \"you all\" used in Spain (not Latin America) — takes a different verb ending." } ] },
    "él": { note: "Subject pronoun for \"he\". Like all Spanish subject pronouns, it's usually optional since the verb ending already signals a third-person subject — English speakers tend to include it every time out of habit.",
      compare: [ { word: "ella", note: "Used instead for \"she\" — same verb form, different subject." },
                 { word: "ellos", note: "Used instead for \"they\" (masculine or mixed) — the verb takes a plural ending." } ] },
    "ella": { note: "Subject pronoun for \"she\". Often dropped in natural Spanish once the subject is clear from context — over-including it is a common tell of a direct English-to-Spanish translation.",
      compare: [ { word: "él", note: "Used instead for \"he\" — same verb form." },
                 { word: "ellas", note: "Used instead for \"they\" (an all-female group) — the verb takes a plural ending." } ] },
    "ellos": { note: "Subject pronoun for \"they\" (masculine or mixed group). Common mistake: English speakers assume \"ellos\" only means \"they\" the way English does, but forget it's also the default for any mixed-gender group, even a group of 99 women and 1 man.",
      compare: [ { word: "ellas", note: "Used instead when everyone in the group is female." },
                 { word: "nosotros", note: "Used instead if the speaker is also part of the group (\"we\")." } ] },
    "ellas": { note: "Subject pronoun for \"they\" (an all-female group). Unlike English \"they,\" Spanish forces you to track gender here — a single male in the group flips it to \"ellos.\"",
      compare: [ { word: "ellos", note: "Used instead if the group includes at least one male." },
                 { word: "ella", note: "Used instead for a single woman." } ] },
    "nosotros": { note: "Subject pronoun for \"we.\" Also usually optional, since the -mos verb ending already marks \"we\" — English speakers tend to add it anyway because English can't drop its subject.",
      compare: [ { word: "yo", note: "Used instead if only the speaker is involved, not a group." },
                 { word: "ellos", note: "Used instead if the speaker is describing others, not including themselves." } ] },
    "usted": { note: "The formal \"you\" (singular) — takes the same verb form as él/ella. Common mistake: English speakers often forget \"usted\" exists at all, since English collapses formal and informal \"you\" into one word.",
      compare: [ { word: "tú", note: "The informal \"you\" — used with friends, family, or peers." },
                 { word: "ustedes", note: "The plural \"you all\" (formal or, in Latin America, general)." } ] },
    "me": { note: "Object pronoun meaning \"me/myself.\" Common mistake: English speakers place object pronouns after the verb (\"He lent me...\"), but Spanish puts them before the conjugated verb (\"Me prestó...\") — putting \"me\" after the verb here is one of the most frequent word-order errors for English speakers.",
      compare: [ { word: "te", note: "Used instead when \"you\" (informal) are affected." },
                 { word: "se", note: "Used instead for a third-person subject affecting themselves, or as the required form before lo/la/los/las." } ] },
    "te": { note: "Object pronoun meaning \"you\" (informal). Common mistake: like all Spanish object pronouns, it goes before the conjugated verb, the reverse of English word order (\"I see you\" → \"Te veo,\" literally \"you I-see\").",
      compare: [ { word: "me", note: "Used instead when the speaker themself is affected." },
                 { word: "le", note: "Used instead for a third-person indirect object (\"to him/her\")." } ] },
    "le": { note: "Indirect object pronoun meaning \"to him/her/you(formal).\" Common mistake: English uses the same word (\"him\") whether he's the direct object (\"I see him\") or the indirect object (\"I gave him money\"), so English speakers often reach for \"lo\" here by habit. Spanish keeps the two separate: \"lo\" for direct objects, \"le\" for indirect ones.",
      compare: [ { word: "les", note: "Used instead when there's more than one receiver (\"to them\")." },
                 { word: "se", note: "Used instead automatically whenever \"le\" would sit right before lo/la/los/las." } ] },
    "les": { note: "Indirect object pronoun meaning \"to them/you all\" — plural receiver. Same English-speaker trap as \"le\": English's \"them\" doesn't distinguish direct from indirect, but Spanish requires \"les\" specifically for the receiver of an action, not the thing acted on.",
      compare: [ { word: "le", note: "Used instead for a single receiver." },
                 { word: "se", note: "Used instead automatically whenever \"les\" would sit right before lo/la/los/las." } ] },
    "lo": { note: "Direct object pronoun for a masculine singular thing/person, or a neutral idea (\"it\"). Common mistake: English speakers often skip the pronoun entirely (just saying \"tengo\" for \"I have it\") because English can sometimes imply the object from context — Spanish almost always needs \"lo\" stated.",
      compare: [ { word: "la", note: "Used instead for a feminine singular direct object." },
                 { word: "los", note: "Used instead for a masculine plural direct object." } ] },
    "la": { note: "Direct object pronoun for a feminine singular thing/person (\"it/her\"). Placed before a noun instead, it's simply the feminine \"the.\" Common mistake: English has no gender on \"it,\" so English speakers have to consciously track whether the noun being replaced is masculine or feminine — there's no shortcut, it has to be memorized with the noun.",
      compare: [ { word: "lo", note: "Used instead for a masculine singular direct object." },
                 { word: "las", note: "Used instead for a feminine plural direct object." } ] },
    "los": { note: "Direct object pronoun for a masculine (or mixed) plural group (\"them\"). Placed before a noun instead, it's the masculine plural \"the.\" Common mistake: English \"them\" is gender-neutral, so English speakers forget Spanish forces a gender choice even for groups of things, not just people.",
      compare: [ { word: "las", note: "Used instead for an all-feminine plural group." },
                 { word: "lo", note: "Used instead for one single masculine thing." } ] },
    "las": { note: "Direct object pronoun for a feminine plural group (\"them\"). Placed before a noun instead, it's the feminine plural \"the.\" Same trap as \"los\": English's genderless \"them\" hides a distinction Spanish always makes.",
      compare: [ { word: "los", note: "Used instead for a masculine or mixed plural group." },
                 { word: "la", note: "Used instead for one single feminine thing." } ] },
    "se": { note: "Either a reflexive pronoun (the subject acting on themselves) or the required replacement for \"le/les\" right before lo/la/los/las. Common mistake: English speakers often try to say \"le lo\" by direct translation of \"to him it\" — Spanish never allows those two pronouns next to each other and swaps the first one to \"se\" instead, which feels unintuitive coming from English.",
      compare: [ { word: "le", note: "The word \"se\" replaces this exact word whenever it would otherwise sit directly before a direct object pronoun." },
                 { word: "me", note: "Used instead for a first-person reflexive action (\"myself\")." } ] },
    "el": { note: "Masculine singular \"the\" — signals the noun that follows is masculine and singular. Common mistake: English's single, genderless \"the\" gives learners nothing to lean on here — Spanish gender mostly has to be memorized noun by noun, not guessed from meaning.",
      compare: [ { word: "la", note: "Used instead before a feminine singular noun." },
                 { word: "los", note: "Used instead before a masculine plural noun." } ] },
    "la ": { note: "Feminine singular \"the.\"", compare: [] },
    "los ": { note: "Masculine plural \"the.\"", compare: [] },
    "un": { note: "Masculine singular \"a/an\" — introduces a nonspecific masculine singular noun. Same gender-agreement habit English speakers have to build, since \"a/an\" carries no gender in English.",
      compare: [ { word: "una", note: "Used instead before a feminine singular noun." },
                 { word: "unos", note: "Used instead before a masculine plural noun (\"some\")." } ] },
    "una": { note: "Feminine singular \"a/an.\" Requires matching every adjective and article around the noun to feminine too — a whole agreement chain English doesn't have.",
      compare: [ { word: "un", note: "Used instead before a masculine singular noun." },
                 { word: "unas", note: "Used instead before a feminine plural noun (\"some\")." } ] },
    "que": { note: "Connects a main clause to a dependent clause — often exactly where the subjunctive kicks in after expressions of wish, doubt, or emotion. Common mistake: English marks this kind of clause with normal-looking verbs (\"I hope that you ARE happy\"), so English speakers often don't realize Spanish requires a distinct subjunctive verb form right after \"que\" in these cases, since English doesn't mark this mood clearly.",
      compare: [ { word: "si", note: "Used instead to mean \"if,\" setting up a condition rather than linking two clauses." },
                 { word: "porque", note: "Used instead to give a reason (\"because\") rather than introduce a dependent clause." } ] },
    "no": { note: "Negates the verb that follows. Common mistake: English grammar-school rules say \"don't use a double negative,\" but standard Spanish requires it — \"no veo a nadie\" (literally \"I don't see nobody\") is correct, and English speakers often wrongly drop the \"no\" to avoid what feels like a double negative.",
      compare: [ { word: "nunca", note: "A stronger negation meaning \"never.\"" },
                 { word: "tampoco", note: "Used instead to mean \"neither/not either,\" agreeing with a previous negative." } ] },
    "a": { note: "A preposition with a few jobs: marking a person as a direct object (the \"personal a\"), introducing a destination, or marking an indirect-object phrase like \"a mi abuela.\" Common mistake: the personal \"a\" (as in \"Vi a mis amigos\") has no equivalent word in English at all, so English speakers routinely forget it before a specific person.",
      compare: [ { word: "de", note: "Used instead to show possession, origin, or \"of.\"" },
                 { word: "en", note: "Used instead to show static location \"in/on/at.\"" } ] },
    "de": { note: "Preposition meaning \"of/from\" — shows possession, origin, or connects two nouns. Common mistake: English shows possession by re-ordering words (\"Juan's book\"), while Spanish always uses \"de\" plus normal word order (\"el libro de Juan\") — English speakers often try to invert the noun order instead.",
      compare: [ { word: "a", note: "Used instead to mark a destination or indirect object." },
                 { word: "con", note: "Used instead to mean \"with.\"" } ] },
    "en": { note: "Preposition meaning \"in/on/at\" — marks location or time. Common mistake: English has three separate words (in/on/at) for ideas Spanish often folds into just \"en,\" so English speakers overthink which one to use instead of defaulting to \"en\" for static location.",
      compare: [ { word: "a", note: "Used instead for direction/destination rather than a static location." },
                 { word: "de", note: "Used instead to show origin (\"from\")." } ] },
    "para": { note: "Preposition often meaning \"for/in order to\" — points toward purpose, destination, or a deadline. Common mistake: English speakers use \"for\" for almost everything, then default to \"para\" for all of it in Spanish, when many of those cases (cause, exchange, duration) actually need \"por\" instead.",
      compare: [ { word: "por", note: "Used instead for cause, exchange, or \"through/by\" rather than purpose or deadline." },
                 { word: "a", note: "Used instead simply to mark a destination without the sense of purpose." } ] },
    "por": { note: "Preposition often meaning \"because of/through/by/in exchange for.\" Common mistake: since English's \"for\" covers both \"por\" and \"para,\" English speakers frequently swap the two — a classic tell is saying \"para\" when the sentence is really about a cause or reason, which needs \"por.\"",
      compare: [ { word: "para", note: "Used instead for purpose, destination, or a deadline, not cause or exchange." },
                 { word: "a", note: "Used instead simply to mark a destination." } ] },
    "porque": { note: "\"Because\" — introduces a reason. Common mistake: don't confuse it with \"por qué\" (two words, with an accent), which means \"why?\" — English's single spelling of \"because/why\" word families doesn't map cleanly onto this split.",
      compare: [ { word: "que", note: "Used instead just to link a main clause to a dependent one, without giving a reason." },
                 { word: "si", note: "Used instead to mean \"if,\" not \"because.\"" } ] },
    "si": { note: "\"If\" — sets up a condition. Common mistake: don't confuse it with \"sí\" (with an accent), meaning \"yes\" — easy to mix up since English doesn't use accents to separate word meanings this way.",
      compare: [ { word: "que", note: "Used instead to link a main clause to a dependent one, not to set a condition." },
                 { word: "cuando", note: "Used instead to mean \"when,\" a time condition rather than an if-condition." } ] },
    "ayer": { note: "\"Yesterday\" — a finished-time marker that almost always calls for the preterite tense. Common mistake: English speakers often default to whichever past tense they learned first (usually the preterite-like form), without registering that Spanish uses \"ayer\" as a strong signal specifically for the preterite over the imperfect.",
      compare: [ { word: "mañana", note: "\"Tomorrow\" — points to the future tense instead." },
                 { word: "antes", note: "\"Before/in the past generally\" — points to the imperfect for ongoing or repeated past instead." } ] },
    "mañana": { note: "\"Tomorrow\" — a future-time marker, cueing the future tense (or present tense used with future meaning). Common mistake: English speakers often reach for the grammatical future (\"will\") automatically, when natural spoken Spanish frequently just uses the present tense here instead, similar to English \"I'm leaving tomorrow.\"",
      compare: [ { word: "ayer", note: "\"Yesterday\" — points to the preterite instead." },
                 { word: "hoy", note: "\"Today\" — points to the present tense instead." } ] },

  const answerBubbleEl = document.getElementById("answerBubble");
  const explainCardEl = document.getElementById("explainCard");

  const GROUPS = ["Todos", ...Array.from(new Set(ITEMS.map(i => i.topic.split(" · ")[0])))];
  let activeGroup = "Todos";

  let pool = [];
  let order = [];
  let idx = 0;
  let score = 0;
  let streak = 0;
  let best = Number(localStorage.getItem("charlemos_grammar_best") || 0);
  let current = null;
  let answered = false;

  bestEl.textContent = best;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function normalizeWord(w) {
    return w.toLowerCase().replace(/^[¿¡"'(\u00bf\u00a1]+|[?!.,;:"')]+$/g, "");
  }

  function renderFilters() {
    filtersEl.innerHTML = "";
    GROUPS.forEach(g => {
      const btn = document.createElement("button");
      btn.className = "filter-btn" + (g === activeGroup ? " active" : "");
      btn.type = "button";
      btn.textContent = g;
      btn.addEventListener("click", () => {
        activeGroup = g;
        renderFilters();
        resetPool();
        loadItem();
      });
      filtersEl.appendChild(btn);
    });
  }

  function resetPool() {
    pool = activeGroup === "Todos" ? ITEMS : ITEMS.filter(i => i.topic.startsWith(activeGroup));
    order = shuffle(pool);
    idx = 0;
  }

  function loadItem() {
    answered = false;
    feedbackEl.innerHTML = "";
    feedbackEl.className = "feedback";
    nextBtn.classList.remove("show");
    answerWrapEl.classList.remove("show");
    answerBubbleEl.innerHTML = "";
    explainCardEl.classList.remove("show");
    explainCardEl.innerHTML = "";

    if (idx >= order.length) {
      order = shuffle(pool);
      idx = 0;
    }

    current = order[idx];
    categoryEl.textContent = current.topic;

    const parts = current.sentence.split("___");
    promptEl.innerHTML = parts[0] + '<span class="blank-static">___</span>' + (parts[1] || "");
    promptSubEl.textContent = "Choose the word that correctly completes the sentence.";
    progressEl.textContent = `Question ${idx + 1} of ${order.length} · ${activeGroup}`;

    const choices = shuffle(current.options);
    optionsEl.innerHTML = "";
    choices.forEach(choice => {
      const btn = document.createElement("button");
      btn.className = "tile";
      btn.type = "button";
      btn.textContent = choice;
      btn.addEventListener("click", () => handleAnswer(btn, choice));
      optionsEl.appendChild(btn);
    });
  }

  function renderExplainCard(label, note, compareList) {
    let html = '<div class="lead"><b>' + label + '</b> — ' + note + '</div>';
    if (compareList && compareList.length) {
      html += '<div class="compare-title">Compare with</div><ul>';
      compareList.forEach(c => {
        html += '<li><b>' + c.word + '</b> — ' + c.note + '</li>';
      });
      html += '</ul>';
    }
    explainCardEl.innerHTML = html;
    explainCardEl.classList.add("show");
  }

  function onChunkClick(el, rawWord, isAnswerChunk) {
    answerBubbleEl.querySelectorAll(".chunk.selected").forEach(c => c.classList.remove("selected"));
    el.classList.add("selected");

    const cleanLabel = rawWord.replace(/[¿¡?!.,;:"'()]/g, "");
    const key = normalizeWord(rawWord);

    if (isAnswerChunk) {
      const note = current.notes["__blank__"] || "This is the target word for this exercise.";
      renderExplainCard(cleanLabel, note, current.compare);
      return;
    }

    let note = current.notes[key];
    let compareList = null;

    if (!note && GENERAL_NOTES[key]) {
      note = GENERAL_NOTES[key].note;
      compareList = GENERAL_NOTES[key].compare;
    }
    if (!note) {
      note = "This word carries the sentence's meaning but isn't the specific grammar focus of this exercise.";
    }

    renderExplainCard(cleanLabel, note, compareList);
  }

  function buildAnswerBubble() {
    answerBubbleEl.innerHTML = "";
    const parts = current.sentence.split("___");
    const beforeWords = parts[0].trim().split(/\s+/).filter(Boolean);
    const afterWords = (parts[1] || "").trim().split(/\s+/).filter(Boolean);

    beforeWords.forEach(w => {
      const chip = document.createElement("span");
      chip.className = "chunk";
      chip.textContent = w;
      chip.addEventListener("click", () => onChunkClick(chip, w, false));
      answerBubbleEl.appendChild(chip);
    });

    const answerChip = document.createElement("span");
    answerChip.className = "chunk is-answer";
    answerChip.textContent = current.answer;
    answerChip.addEventListener("click", () => onChunkClick(answerChip, current.answer, true));
    answerBubbleEl.appendChild(answerChip);

    afterWords.forEach(w => {
      const chip = document.createElement("span");
      chip.className = "chunk";
      chip.textContent = w;
      chip.addEventListener("click", () => onChunkClick(chip, w, false));
      answerBubbleEl.appendChild(chip);
    });
  }

  function handleAnswer(btn, choice) {
    if (answered) return;
    answered = true;
    const isCorrect = choice === current.answer;

    [...optionsEl.children].forEach(tile => {
      tile.disabled = true;
      if (tile.textContent === current.answer) tile.classList.add("correct");
    });

    if (isCorrect) {
      btn.classList.add("correct");
      score += 10;
      streak += 1;
      feedbackEl.innerHTML = "¡Correcto!" + '<span class="translation">' + current.translation + '</span>';
      feedbackEl.classList.add("ok");
    } else {
      btn.classList.add("wrong");
      streak = 0;
      feedbackEl.innerHTML = `Not quite — the answer is <strong>${current.answer}</strong>.` + '<span class="translation">' + current.translation + '</span>';
      feedbackEl.classList.add("no");
    }

    if (score > best) {
      best = score;
      localStorage.setItem("charlemos_grammar_best", String(best));
    }

    scoreEl.textContent = score;
    streakEl.textContent = streak;
    bestEl.textContent = best;

    buildAnswerBubble();
    answerWrapEl.classList.add("show");
    nextBtn.classList.add("show");
  }

  function speakCurrent() {
    if (!current) return;
    if (!("speechSynthesis" in window)) return;
    const fullSentence = current.sentence.replace("___", current.answer);
    const utter = new SpeechSynthesisUtterance(fullSentence);
    utter.lang = "es-ES";
    utter.rate = 0.9;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
  }

  nextBtn.addEventListener("click", () => { idx += 1; loadItem(); });
  speakBtn.addEventListener("click", speakCurrent);

  renderFilters();
  resetPool();
  loadItem();
</script>

</body>
</html>
