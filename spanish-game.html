        "café": "The grammatical subject of \"gusta\" — the thing doing the pleasing.",
        "ti": "Clarifies that the indirect object pronoun refers to \"you.\"",
        "__blank__": "\"Te\" is the second-person indirect object pronoun, matching \"a ti.\" Common mistake: verbs like \"gustar\" flip the sentence structure English speakers expect \u2014 the thing liked is the subject and the person is the indirect object, so \"you like coffee\" becomes, literally, \"coffee is pleasing TO you.\"" } },

    // ---------------- SE replacing le/les before lo/la ----------------
    { topic: "Pronombres · se + lo/la", sentence: "Le di el libro a Juan. → ___ lo di ayer.", answer: "Se", options: ["Le", "Les", "Se", "Me"],
      translation: "I gave Juan the book. → I gave it to him yesterday.",
      compare: [ { word: "Le", note: "The normal indirect pronoun — but Spanish forbids \"le lo\" together, forcing the switch to \"se.\"" },
                 { word: "Les", note: "Would only apply with multiple recipients — and would still become \"se\" before \"lo.\"" } ],
      notes: { "di": "\"I gave\" — preterite of dar, in both the original and rewritten sentence.",
        "lo": "Direct object pronoun for \"el libro\" — stays the same; only the indirect pronoun changes.",
        "__blank__": "Spanish never allows \"le lo\" together — \"le\" (or \"les\") automatically becomes \"se\" whenever it's followed by lo/la/los/las. Common mistake: this rule has no English parallel at all (\"I gave it to him\" just stacks words normally), so English speakers very often write the ungrammatical \"le lo di\" instead of the required \"se lo di.\"",
        "ayer": "Finished-time marker, matching the preterite \"di.\"" } },
    { topic: "Pronombres · se + lo/la", sentence: "¿El regalo? ___ lo di a ella en su cumpleaños.", answer: "Se", options: ["Le", "Les", "Se", "Te"],
      translation: "The gift? I gave it to her on her birthday.",
      compare: [ { word: "Le", note: "Would be the expected form, but it's blocked here because \"lo\" follows immediately." },
                 { word: "Te", note: "Used instead if the gift were given to \"you.\"" } ],
      notes: { "regalo": "The item referred to by \"lo.\"",
        "lo": "Direct object pronoun for \"el regalo.\"",
        "ella": "Clarifies who \"se\" refers to, since \"se\" alone is ambiguous.",
        "__blank__": "\"Se\" replaces what would otherwise be \"le\" here, because it's directly followed by the direct object pronoun \"lo.\" Common mistake: because this \"se\" looks identical to reflexive \"se,\" English speakers sometimes misread the sentence as reflexive (\"she gave it to herself\") instead of recognizing it as the swapped indirect object pronoun.",
        "cumpleaños": "The occasion for the gift." } },

    // ---------------- REFLEXIVE ----------------
    { topic: "Pronombres · reflexivo", sentence: "Ella ___ levanta temprano todos los días.", answer: "se", options: ["le", "se", "lo", "la"],
      translation: "She gets (herself) up early every day.",
      compare: [ { word: "le", note: "An indirect object pronoun — wrong category; this action is reflexive, not something done for someone else." },
                 { word: "lo", note: "A direct object pronoun — wrong category for a reflexive action." } ],
      notes: { "ella": "Third-person subject, matching the reflexive pronoun \"se.\"",
        "__blank__": "\"Se\" is the third-person reflexive pronoun — the subject is doing the action of getting up to herself. Common mistake: English rarely marks routines like this as reflexive (\"she gets up,\" not \"she gets herself up\"), so English speakers frequently forget to include \"se\" at all on everyday routine verbs.",
        "temprano": "\"Early\" — describes when she gets up.",
        "todos": "\"Every,\" part of the repeated-time phrase.",
        "días": "\"Days\" — completes \"todos los días,\" a habitual time cue matching the present tense." } },
    { topic: "Pronombres · reflexivo", sentence: "Ellos ___ visten rápido por la mañana.", answer: "se", options: ["le", "se", "los", "las"],
      translation: "They get (themselves) dressed quickly in the morning.",
      compare: [ { word: "los", note: "A direct object pronoun — would wrongly suggest they're dressing someone else, not themselves." },
                 { word: "le", note: "An indirect object pronoun — wrong category here." } ],
      notes: { "ellos": "Third-person plural subject, still paired with the same reflexive pronoun \"se\" (it doesn't change for plural).",
        "__blank__": "\"Se\" is the reflexive pronoun for third-person subjects, singular or plural. Common mistake: same gap as with \"levantarse\" \u2014 English doesn't treat \"getting dressed\" as reflexive, so the pronoun is easy to drop by habit.",
        "rápido": "\"Quickly\" — describes how they dress.",
        "mañana": "Here it means \"morning,\" the time of the routine." } },
    { topic: "Pronombres · reflexivo", sentence: "Yo ___ ducho antes de salir de casa.", answer: "me", options: ["me", "te", "se", "le"],
      translation: "I shower (myself) before leaving the house.",
      compare: [ { word: "te", note: "Used instead if \"you\" were showering yourself." },
                 { word: "se", note: "Used instead for a third-person subject showering themselves." } ],
      notes: { "yo": "First-person subject, matching the reflexive pronoun \"me.\"",
        "__blank__": "\"Me\" is the first-person reflexive pronoun — the subject showers themselves. Common mistake: English says \"I shower,\" full stop \u2014 no reflexive pronoun needed \u2014 so English speakers often produce the grammatically incomplete \"Yo ducho\" instead of \"Me ducho.\"",
        "antes": "\"Before,\" setting the order of events.",
        "salir": "The action that follows — leaving.",
        "casa": "Where they leave from." } },
    { topic: "Pronombres · reflexivo", sentence: "¿A qué hora ___ acuestas tú normalmente?", answer: "te", options: ["me", "te", "se", "le"],
      translation: "What time do you usually go to bed?",
      compare: [ { word: "me", note: "Used instead if the speaker were the one asking about themselves." },
                 { word: "se", note: "Used instead for a third-person subject going to bed." } ],
      notes: { "hora": "\"Time/hour\" — what's being asked about.",
        "__blank__": "\"Te\" is the second-person reflexive pronoun — you put yourself to bed. Common mistake: English \"go to bed\" has no reflexive pronoun at all, so this is one of the most commonly dropped pronouns for English speakers learning everyday routine verbs.",
        "tú": "Second-person subject, matching the reflexive pronoun \"te.\"",
        "normalmente": "\"Usually\" — signals a habitual action, fitting the present tense." } },

    // ---------------- IR ----------------
    { topic: "Ir · presente", sentence: "Yo ___ al gimnasio todos los días.", answer: "voy", options: ["voy", "vas", "va", "iba"],
      translation: "I go to the gym every day.",
      compare: [ { word: "va", note: "The él/ella-form — used for a third person's habit, not your own." },
                 { word: "iba", note: "The imperfect — would describe a past habit instead of a current one." } ],
      notes: { "__blank__": "\"Voy\" is the irregular yo-form of ir in the present. Common mistake: ir is completely irregular (voy, vas, va...) and doesn't follow the normal -ir verb pattern, so English speakers often try to regularize it (\"io\") the way they would with a predictable verb.",
        "gimnasio": "Where the going happens.",
        "todos": "\"Every,\" part of the repeated-time phrase.",
        "días": "\"Days\" — completes \"todos los días,\" cueing the present tense for a habit." } },
    { topic: "Ir · pretérito", sentence: "Ellos ___ al cine anoche.", answer: "fueron", options: ["fueron", "van", "iban", "irán"],
      translation: "They went to the movies last night.",
      compare: [ { word: "iban", note: "The imperfect — would describe a repeated past habit of going, not one specific outing." },
                 { word: "irán", note: "The future — would place the trip ahead in time." } ],
      notes: { "__blank__": "\"Fueron\" is the preterite of ir. Common mistake: ir and ser share the exact same preterite forms (fui, fuiste, fue, fuimos, fuisteis, fueron) — English speakers are often thrown off that one word can mean both \"went\" and \"was/were,\" with only context to tell them apart.",
        "cine": "Where they went.",
        "anoche": "\"Last night\" — a finished-time marker, cueing the preterite." } },
    { topic: "Ir · ir a + infinitivo", sentence: "Nosotros ___ a viajar el próximo mes.", answer: "vamos", options: ["vamos", "iremos", "fuimos", "vayamos"],
      translation: "We are going to travel next month.",
      compare: [ { word: "iremos", note: "The simple future — grammatically correct too, but \"vamos a\" is far more common in everyday speech, just like English favors \"going to\" over \"will\" in casual talk." },
                 { word: "fuimos", note: "The preterite — would say we already went, not that we're planning to." } ],
      notes: { "__blank__": "\"Vamos\" here is the present tense of ir used in the \"ir a + infinitive\" construction — Spanish's version of English's \"going to.\" Common mistake: English speakers often forget the \"a\" that has to sit between the conjugated ir and the infinitive (\"vamos viajar\" is wrong; it must be \"vamos a viajar\").",
        "viajar": "The infinitive naming the planned action.",
        "próximo": "\"Next,\" part of the future-time marker.",
        "mes": "\"Month\" — the future-time marker." } },

    // ---------------- SABER vs CONOCER ----------------
    { topic: "Saber/Conocer · saber + infinitivo", sentence: "Yo ___ hablar español.", answer: "sé", options: ["sé", "conozco", "sepa", "conozca"],
      translation: "I know how to speak Spanish.",
      compare: [ { word: "conozco", note: "Wrong verb here — conocer is for familiarity with people/places, not skills or facts." },
                 { word: "sepa", note: "The subjunctive form — would only be correct after a doubt/wish trigger, not in a plain statement." } ],
      notes: { "__blank__": "\"Sé\" is the irregular yo-form of saber, used with an infinitive to mean \"know how to.\" Common mistake: English \"know\" covers both saber and conocer, so English speakers often can't tell which one to reach for — saber is for facts, information, and skills (know-how); conocer is for people, places, and things you're personally familiar with.",
        "hablar": "The skill being known — \"to speak.\"" } },
    { topic: "Saber/Conocer · conocer + persona", sentence: "¿___ tú a mi hermana?", answer: "Conoces", options: ["Conoces", "Sabes", "conozcas", "sepas"],
      translation: "Do you know my sister?",
      compare: [ { word: "Sabes", note: "Wrong verb here — you don't \"saber\" a person, only facts, skills, or information." },
                 { word: "conozcas", note: "The subjunctive form — only correct after a wish/doubt trigger, not in a direct question." } ],
      notes: { "__blank__": "\"Conoces\" is the tú-form of conocer, used because it's asking about being acquainted with a person. Common mistake: English speakers very often say \"sabes\" here by direct translation of \"know,\" which sounds wrong to a native speaker — conocer is required whenever the object is a person.",
        "a": "The \"personal a,\" required before a specific person as a direct object — another spot English speakers often forget entirely.",
        "hermana": "The person being asked about." } },
    { topic: "Saber/Conocer · saber + información", sentence: "Ella ___ dónde está el museo.", answer: "sabe", options: ["sabe", "conoce", "sepa", "conozca"],
      translation: "She knows where the museum is.",
      compare: [ { word: "conoce", note: "Would suggest she's personally familiar with the museum itself, not just aware of its location." },
                 { word: "sepa", note: "The subjunctive — only correct after a doubt/wish trigger." } ],
      notes: { "__blank__": "\"Sabe\" is the él/ella-form of saber, used for factual information (here, the museum's location). Common mistake: whenever \"know\" is followed by a question word like dónde/qué/cómo/cuándo, it's almost always saber, not conocer — a pattern worth memorizing directly.",
        "dónde": "\"Where\" — introduces the fact being known.",
        "museo": "The place whose location is known." } },
    { topic: "Saber/Conocer · conocer + lugar", sentence: "Nosotros ___ ese restaurante muy bien.", answer: "conocemos", options: ["conocemos", "sabemos", "conozcamos", "sepamos"],
      translation: "We know that restaurant very well.",
      compare: [ { word: "sabemos", note: "Wrong verb here — you don't \"saber\" a place you've personally visited, you \"conocer\" it." },
                 { word: "conozcamos", note: "The subjunctive form — only correct after a wish/doubt trigger." } ],
      notes: { "__blank__": "\"Conocemos\" is the nosotros-form of conocer, used for familiarity with a place. Common mistake: English speakers translate \"we know that restaurant\" with saber by default, missing that personal familiarity with a physical place always calls for conocer.",
        "restaurante": "The place being familiar to them.",
        "bien": "\"Well\" — intensifies how familiar they are with it." } },

    // ---------------- VERBS LIKE GUSTAR ----------------
    { topic: "Verbos como gustar · encantar", sentence: "A mí me ___ los libros de misterio.", answer: "encantan", options: ["encantan", "encanta", "gusta", "gustan"],
      translation: "I love mystery books.",
      compare: [ { word: "encanta", note: "Would only be correct if the thing loved were singular — but \"los libros\" is plural, so the verb must be too." },
                 { word: "gustan", note: "\"Gustan\" (from gustar) would work grammatically too and mean roughly \"I really like,\" but \"encantan\" is the stronger \"love.\"" } ],
      notes: { "a": "Part of \"a mí,\" a clarifying phrase that emphasizes or confirms who is doing the loving.",
        "mí": "\"Me\" (emphatic form after a preposition) — reinforces \"me\" right after it.",
        "me": "Indirect object pronoun — I'm the one affected, not the grammatical subject.",
        "__blank__": "\"Encantan\" is the present tense of encantar, agreeing with \"los libros\" (plural), the true grammatical subject. Common mistake: English speakers instinctively treat \"me\" as the subject (like English \"I love\"), so they often conjugate for \"yo\" (\"encanto\") instead of matching the verb to the thing being loved.",
        "misterio": "\"Mystery\" — describes the kind of books." } },
    { topic: "Verbos como gustar · faltar", sentence: "A nosotros nos ___ dos días para las vacaciones.", answer: "faltan", options: ["faltan", "falta", "falto", "faltas"],
      translation: "We have two days left until vacation.",
      compare: [ { word: "falta", note: "Would only be correct if just one day were left — \"dos días\" is plural, so the verb has to agree with it." },
                 { word: "falto", note: "The yo-form — wrongly treats the speaker as the grammatical subject instead of \"dos días.\"" } ],
      notes: { "nos": "Indirect object pronoun — \"to us,\" the ones affected by the days remaining.",
        "__blank__": "\"Faltan\" is the present tense of faltar (\"to be lacking/missing\"), agreeing with \"dos días,\" the grammatical subject. Common mistake: just like with gustar, English speakers try to make \"nosotros\" the subject (\"we are lacking\") instead of letting the thing counted — the days — control the verb.",
        "vacaciones": "What the two days are counting down to." } },
    { topic: "Verbos como gustar · doler", sentence: "A ella le ___ la cabeza.", answer: "duele", options: ["duele", "duelen", "dueles", "duelo"],
      translation: "Her head hurts.",
      compare: [ { word: "duelen", note: "Would only be correct with a plural body part, like \"los pies\" (the feet)." },
                 { word: "duelo", note: "The yo-form — wrongly treats the speaker as the one in pain instead of \"la cabeza.\"" } ],
      notes: { "le": "Indirect object pronoun — \"to her,\" the person experiencing the pain.",
        "__blank__": "\"Duele\" is the present tense of doler (\"to hurt\"), agreeing with \"la cabeza,\" the singular subject. Common mistake: English says \"she hurts\" with the person as subject, so English speakers often conjugate doler for the person (\"duelo,\" \"dueles\") instead of the body part that's actually doing the hurting grammatically.",
        "cabeza": "The body part that hurts — the true grammatical subject of the sentence." } },

    // ---------------- QUERER ----------------
    { topic: "Querer · presente", sentence: "Yo ___ un café, por favor.", answer: "quiero", options: ["quiero", "quise", "querré", "quiera"],
      translation: "I want a coffee, please.",
      compare: [ { word: "quise", note: "The preterite — in this tense querer often means \"tried to,\" not a simple present want." },
                 { word: "querré", note: "The future — would place the wanting ahead in time instead of right now." } ],
      notes: { "__blank__": "\"Quiero\" is the irregular yo-form of querer (o→ie stem change) in the present, a simple, direct way to state a want.",
        "café": "The thing wanted.",
        "favor": "Part of \"por favor,\" meaning \"please.\"" } },
    { topic: "Querer · pretérito (significado especial)", sentence: "Ayer ___ llamarte pero no pude.", answer: "quise", options: ["quise", "quiero", "quería", "querré"],
      translation: "Yesterday I tried to call you but couldn't.",
      compare: [ { word: "quería", note: "The imperfect — would describe an ongoing, general desire rather than one specific attempt." },
                 { word: "quiero", note: "The present — would say I want to call you right now, not that I tried yesterday." } ],
      notes: { "ayer": "Finished-time marker, cueing the preterite.",
        "__blank__": "\"Quise\" is the preterite of querer. Common mistake: in the preterite, querer often shifts meaning to \"tried to\" (and \"no quise\" means \"refused to\") rather than a simple \"wanted\" — a meaning shift English speakers rarely expect, since English \"wanted\" doesn't carry that same nuance.",
        "llamarte": "\"To call you\" — the infinitive action, with \"te\" attached to the end.",
        "pude": "\"I could/managed to\" — preterite of poder, paired here with \"no\" to mean \"couldn't.\"" } },
    { topic: "Querer · subjuntivo", sentence: "Quiero que ___ conmigo.", answer: "vengas", options: ["vengas", "vienes", "vendrás", "vinieras"],
      translation: "I want you to come with me.",
      compare: [ { word: "vienes", note: "The indicative — a plain statement, not something being wanted from someone else." },
                 { word: "vendrás", note: "The future indicative — a prediction, not a request." } ],
      notes: { "quiero": "\"I want\" — wanting someone else to do something triggers the subjunctive in the clause that follows.",
        "que": "Introduces the wanted action.",
        "__blank__": "\"Vengas\" is the tú-form present subjunctive of venir, required after \"quiero que.\" Common mistake: English uses an infinitive here (\"I want you TO come\"), so English speakers often try \"quiero que tú venir\" instead of conjugating the subjunctive.",
        "conmigo": "\"With me\" — a special fused form (not \"con mí\")." } },

    // ---------------- DECIR ----------------
    { topic: "Decir · presente", sentence: "Yo siempre ___ la verdad.", answer: "digo", options: ["digo", "dices", "dije", "diré"],
      translation: "I always tell the truth.",
      compare: [ { word: "dije", note: "The preterite — would say I told the truth once, not that it's a general habit." },
                 { word: "diré", note: "The future — would place the truth-telling ahead in time." } ],
      notes: { "siempre": "\"Always\" — signals a habitual action, fitting the present tense.",
        "__blank__": "\"Digo\" is the irregular yo-form of decir in the present. Common mistake: decir is irregular in a way that doesn't look like a typical -ir verb (digo, dices, dice...), so English speakers often try to regularize it as \"decio.\"",
        "verdad": "What is told — the truth." } },
    { topic: "Decir · pretérito", sentence: "Ella me ___ que vendría tarde.", answer: "dijo", options: ["dijo", "dice", "decía", "dirá"],
      translation: "She told me she would come late.",
      compare: [ { word: "decía", note: "The imperfect — would describe something she used to say repeatedly, not one specific message." },
                 { word: "dirá", note: "The future — would place the telling ahead in time instead of in the past." } ],
      notes: { "me": "Indirect object pronoun — I'm the one who was told.",
        "__blank__": "\"Dijo\" is the irregular preterite of decir. Common mistake: unlike regular -er/-ir preterites, decir's preterite forms (dije, dijiste, dijo...) drop the expected accent marks and change the stem entirely — English speakers often misspell or mis-stress this form by treating it like a regular verb.",
        "vendría": "\"Would come\" — the conditional of venir, reporting what she said inside the quote." } },

    // ---------------- CONDITIONAL (would / could / should) ----------------
    { topic: "Condicional · would (regular)", sentence: "Yo ___ un café si tuviera tiempo.", answer: "tomaría", options: ["tomaría", "tomo", "tomé", "tomaré"],
      translation: "I would have a coffee if I had time.",
      compare: [ { word: "tomaré", note: "The future (\"will\") — a different meaning; the conditional \"would\" needs the -ía ending, not -é." },
                 { word: "tomo", note: "The present — would say I'm having coffee now, with no \"if\" condition attached." } ],
      notes: { "__blank__": "\"Tomaría\" is the conditional of tomar, built by adding -ía endings to the full infinitive. Common mistake: English \"would\" is a separate helper word, but Spanish builds \"would\" directly into the verb ending — there's no standalone word for \"would\" to translate.",
        "si": "\"If\" — sets up the hypothetical condition that pairs with the conditional tense.",
        "tuviera": "\"Had\" — imperfect subjunctive of tener, used in the \"if\" clause of this kind of hypothetical sentence." } },
    { topic: "Condicional · would (irregular)", sentence: "Con más dinero, nosotros ___ una casa más grande.", answer: "tendríamos", options: ["tendríamos", "tenemos", "tuvimos", "tendremos"],
      translation: "With more money, we would have a bigger house.",
      compare: [ { word: "tendremos", note: "The future — would state a confident plan (\"we will have\"), not a hypothetical." },
                 { word: "tuvimos", note: "The preterite — would say we already had it, not a hypothetical \"would.\"" } ],
      notes: { "__blank__": "\"Tendríamos\" is the conditional of tener, built on the same irregular stem (tendr-) used in the future tense, plus the -íamos ending. Common mistake: English speakers often forget that verbs with irregular future stems (tener, hacer, poder, decir...) keep that same irregular stem in the conditional too.",
        "dinero": "\"Money\" — the hypothetical resource.",
        "grande": "\"Big\" — describes the house." } },
    { topic: "Condicional · cortesía (gustaría)", sentence: "Me ___ viajar a España algún día.", answer: "gustaría", options: ["gustaría", "gusta", "gustó", "gustará"],
      translation: "I would like to travel to Spain someday.",
      compare: [ { word: "gusta", note: "The present — \"me gusta\" means \"I like,\" a flatter, more direct statement than the softer \"I would like.\"" },
                 { word: "gustará", note: "The future — would predict future liking rather than politely express a wish now." } ],
      notes: { "me": "Indirect object pronoun — gustar-type verbs always put the person as the object, not the subject.",
        "__blank__": "\"Gustaría\" is the conditional of gustar. Common mistake: \"me gustaría\" (\"I would like\") is far more common and polite in everyday Spanish than \"quiero\" (\"I want\") — English speakers who only learn \"quiero\" can come across as blunter than intended.",
        "viajar": "The infinitive naming the wished-for action.",
        "españa": "The destination." } },
    { topic: "Condicional · could (poder)", sentence: "¿___ usted ayudarme, por favor?", answer: "Podría", options: ["Podría", "Puede", "Pudo", "Podrá"],
      translation: "Could you help me, please?",
      compare: [ { word: "Puede", note: "The present (\"can you\") — grammatically fine but more direct/blunt than the softer conditional." },
                 { word: "Pudo", note: "The preterite — would ask about a completed past ability, not a polite request." } ],
      notes: { "__blank__": "\"Podría\" is the conditional of poder, used here to soften a request — the Spanish equivalent of English shifting from \"can\" to \"could\" for politeness. Common mistake: English speakers often stick with \"puede\" (present) in polite requests, which isn't wrong, but misses the extra softness \"podría\" adds, the same way \"could you\" sounds gentler than \"can you\" in English.",
        "usted": "Formal \"you\" — reinforces the polite register of the whole request.",
        "ayudarme": "\"To help me\" — the infinitive action requested, with \"me\" attached to the end." } },
    { topic: "Deber · should (presente)", sentence: "Tú ___ estudiar más para el examen.", answer: "debes", options: ["debes", "debo", "debiste", "deberías"],
      translation: "You should study more for the exam.",
      compare: [ { word: "deberías", note: "The conditional — a softer, more suggestion-like \"should,\" very common in everyday advice." },
                 { word: "debiste", note: "The preterite — would say you should have studied (and didn't), a completed missed obligation." } ],
      notes: { "__blank__": "\"Debes\" is the present tense of deber, which paired with an infinitive means \"should/ought to.\" Common mistake: English \"should\" is a single fixed helper word, but Spanish deber is a fully conjugated verb that changes with the subject — English speakers sometimes try to leave it unconjugated.",
        "estudiar": "The infinitive naming the recommended action.",
        "examen": "What the studying is for." } },
    { topic: "Deber · should (condicional, más suave)", sentence: "Nosotros ___ llamar al médico.", answer: "deberíamos", options: ["deberíamos", "debemos", "debimos", "deberemos"],
      translation: "We should call the doctor.",
      compare: [ { word: "debemos", note: "The present — still means \"should/must,\" but reads a bit more like an obligation than a gentle suggestion." },
                 { word: "debimos", note: "The preterite — would say we should have called (and didn't), a missed past obligation." } ],
      notes: { "__blank__": "\"Deberíamos\" is the conditional of deber, the most natural, softest way to say \"should\" in everyday spoken Spanish. Common mistake: English speakers often default to the present \"debemos\" for every \"should,\" not realizing the conditional version sounds gentler — closer to \"we should, maybe\" than \"we must.\"",
        "médico": "Who would be called — the doctor." } },

    // ---------------- POR vs PARA ----------------
    { topic: "Por vs Para · destinatario", sentence: "Este regalo es ___ ti.", answer: "para", options: ["para", "por", "a", "de"],
      translation: "This gift is for you.",
      compare: [ { word: "por", note: "Would suggest the gift was given because of you or in exchange for you, not intended for you as the recipient." },
                 { word: "a", note: "Would mark a destination/indirect object rather than \"intended for.\"" } ],
      notes: { "__blank__": "\"Para\" marks the recipient/intended destination of something. Common mistake: since English \"for\" covers both por and para, English speakers often can't predict which one fits — as a rule of thumb, para = destination/recipient/purpose; por = cause/exchange/movement-through.",
        "regalo": "The thing being given.",
        "ti": "\"You\" (after a preposition) — the intended recipient." } },
    { topic: "Por vs Para · movimiento", sentence: "Caminamos ___ el parque.", answer: "por", options: ["por", "para", "a", "en"],
      translation: "We walked through the park.",
      compare: [ { word: "para", note: "Would suggest walking toward/for the park as a destination, not moving through it." },
                 { word: "en", note: "Would suggest walking around within a fixed spot rather than moving through a space." } ],
      notes: { "__blank__": "\"Por\" marks movement through or around a space. Common mistake: English speakers often reach for \"para\" here since \"through the park\" sounds destination-like in English, but \"por\" is specifically the one used for movement through/along/around.",
        "parque": "The space being walked through." } },
    { topic: "Por vs Para · propósito", sentence: "Trabajo ___ ganar dinero.", answer: "para", options: ["para", "por", "a", "de"],
      translation: "I work (in order) to earn money.",
      compare: [ { word: "por", note: "Would suggest working because of money already had, or in exchange for it, rather than working toward the goal of earning it." },
                 { word: "a", note: "Not idiomatic here — \"a\" doesn't introduce a purpose clause this way." } ],
      notes: { "__blank__": "\"Para\" introduces a purpose or goal (\"in order to\"). Common mistake: purpose is one of the clearest para triggers, but English speakers sometimes still reach for \"por\" since English \"for\" doesn't distinguish purpose from cause.",
        "ganar": "The infinitive naming the goal — \"to earn.\"",
        "dinero": "What is being earned." } },
    { topic: "Por vs Para · causa/razón", sentence: "Gracias ___ tu ayuda.", answer: "por", options: ["por", "para", "a", "de"],
      translation: "Thanks for your help.",
      compare: [ { word: "para", note: "Would sound like the thanks are intended \"for\" a future use of the help, not given because of help already received." },
                 { word: "de", note: "Not idiomatic here — \"gracias de\" isn't how this phrase is built." } ],
      notes: { "__blank__": "\"Por\" marks the cause or reason (here, the reason for the thanks). Common mistake: English \"thanks for\" strongly nudges learners toward \"para,\" but expressions of gratitude in Spanish almost always use \"por,\" since you're thanking someone BECAUSE OF something they already did.",
        "gracias": "\"Thanks\" — the expression being completed.",
        "ayuda": "What the thanks are for — the help given." } },

    // ---------------- MANDATOS (COMMANDS) ----------------
    { topic: "Mandatos · tú afirmativo", sentence: "___ la puerta, por favor.", answer: "Cierra", options: ["Cierra", "Cierras", "Cierres", "Cerrar"],
      translation: "Close the door, please.",
      compare: [ { word: "Cierres", note: "The negative-command/subjunctive form — correct for \"don't close,\" not for a direct affirmative command." },
                 { word: "Cerrar", note: "The plain infinitive — sometimes used informally on signs, but not a proper spoken tú command." } ],
      notes: { "__blank__": "\"Cierra\" is the informal affirmative tú command, which for regular and stem-changing verbs is identical to the él/ella present-tense form. Common mistake: because it looks exactly like third-person \"he/she closes,\" English speakers often don't recognize it as a command directed at \"you\" at all.",
        "puerta": "What's being closed.",
        "favor": "Part of \"por favor,\" softening the command." } },
    { topic: "Mandatos · tú negativo", sentence: "No ___ tarde a la reunión.", answer: "llegues", options: ["llegues", "llegas", "llega", "llegar"],
      translation: "Don't arrive late to the meeting.",
      compare: [ { word: "llega", note: "This is actually the correct AFFIRMATIVE tú command (\"arrive!\") — but it can't be used after \"no\"; negative commands switch to a different form entirely." },
                 { word: "llegas", note: "The plain indicative present — not a command form at all." } ],
      notes: { "no": "Negates the command — and is exactly why the verb form has to change.",
        "__blank__": "\"Llegues\" is the negative tú command, which uses the present subjunctive form instead of the plain present. Common mistake: this is one of the most common command errors for English speakers — they learn the affirmative command (llega) first and then just add \"no\" in front of it (\"no llega\"), not realizing negative commands require a completely different, subjunctive-based form.",
        "tarde": "\"Late\" — describes how the arrival shouldn't happen.",
        "reunión": "What's being arrived at." } },
    { topic: "Mandatos · usted", sentence: "___ conmigo, por favor.", answer: "Venga", options: ["Venga", "Viene", "Vienes", "Vengas"],
      translation: "Come with me, please.",
      compare: [ { word: "Viene", note: "The plain present indicative (\"he/she comes\") — not a command form." },
                 { word: "Vengas", note: "The tú-form subjunctive — wrong person; this sentence is formal (usted), not informal (tú)." } ],
      notes: { "__blank__": "\"Venga\" is the formal (usted) command, built from the present subjunctive. Common mistake: unlike the informal tú affirmative command (which often matches the present tense), formal usted commands always use the subjunctive form — a rule English speakers frequently mix up with the tú pattern.",
        "conmigo": "\"With me\" — a fused pronoun form (not \"con mí\")." } },
    { topic: "Mandatos · nosotros (let's)", sentence: "___ una fiesta este fin de semana.", answer: "Hagamos", options: ["Hagamos", "Hacemos", "Haremos", "Hicimos"],
      translation: "Let's have a party this weekend.",
      compare: [ { word: "Hacemos", note: "The plain present (\"we do/make\") — a statement, not a suggestion to act together." },
                 { word: "Haremos", note: "The future (\"we will\") — a prediction, not an invitation to act now." } ],
      notes: { "__blank__": "\"Hagamos\" is the nosotros command (built from the subjunctive), the standard way to say \"let's...\" in Spanish. Common mistake: English \"let's\" is its own separate word, so English speakers often look for a direct word-for-word equivalent instead of realizing \"let's\" is built directly into this special verb ending.",
        "fiesta": "What they're proposing to have.",
        "fin": "Part of \"fin de semana,\" meaning \"weekend.\"",
        "semana": "\"Week\" — completes \"fin de semana.\"" } },

    // ---------------- COMPARATIVOS ----------------
    { topic: "Comparativos · más...que", sentence: "Este libro es ___ interesante que el otro.", answer: "más", options: ["más", "menos", "tan", "muy"],
      translation: "This book is more interesting than the other one.",
      compare: [ { word: "tan", note: "Would require \"como\" instead of \"que\" afterward, for an equal (not unequal) comparison." },
                 { word: "muy", note: "\"Very\" — intensifies without comparing to anything else; it doesn't pair with \"que.\"" } ],
      notes: { "__blank__": "\"Más\" pairs with \"que\" later in the sentence to build \"more...than.\" Common mistake: English speakers sometimes add \"-er\" style endings out of habit or reach for \"muy\" (very) when they actually mean a comparison between two things, not just intensity.",
        "interesante": "The quality being compared.",
        "otro": "\"The other (one)\" — what the book is being compared against." } },
    { topic: "Comparativos · tan...como", sentence: "Ella es ___ alta como su hermano.", answer: "tan", options: ["tan", "más", "menos", "muy"],
      translation: "She is as tall as her brother.",
      compare: [ { word: "más", note: "Would require \"que\" instead of \"como\" afterward, and would mean \"taller than,\" not \"as tall as.\"" },
                 { word: "muy", note: "\"Very\" — describes intensity alone, with no comparison to her brother at all." } ],
      notes: { "__blank__": "\"Tan\" pairs with \"como\" later in the sentence to build an equal comparison, \"as...as.\" Common mistake: English speakers often mix the two comparative patterns, writing \"tan alta que\" (borrowing \"que\" from the más...que pattern) instead of the correct \"tan alta como.\"",
        "alta": "The quality being compared — \"tall.\"",
        "hermano": "Who she's being compared to." } },
    { topic: "Comparativos · superlativo", sentence: "Juan es el ___ inteligente de la clase.", answer: "más", options: ["más", "tan", "menos", "muy"],
      translation: "Juan is the most intelligent in the class.",
      compare: [ { word: "muy", note: "\"Very intelligent\" — intensifies without ranking him against the rest of the class." },
                 { word: "menos", note: "Would build the opposite superlative, \"the least intelligent.\"" } ],
      notes: { "__blank__": "\"Más\" combines with \"el\" and \"de\" to build a superlative (\"the most... in/of...\"). Common mistake: English adds \"-est\" directly onto the adjective (\"smartest\"), so English speakers sometimes hunt for a similar suffix in Spanish instead of using this el/la + más + adjective + de structure.",
        "inteligente": "The quality being ranked.",
        "clase": "The group he's being ranked within." } },

    // ---------------- ADJETIVOS: PLACEMENT & AGREEMENT ----------------
    { topic: "Adjetivos · concordancia", sentence: "Tengo una casa ___.", answer: "blanca", options: ["blanca", "blanco", "blancas", "blancos"],
      translation: "I have a white house.",
      compare: [ { word: "blanco", note: "The masculine singular form — wrong here, since \"casa\" is feminine." },
                 { word: "blancas", note: "The feminine plural form — wrong here, since \"casa\" is singular." } ],
      notes: { "__blank__": "\"Blanca\" is the feminine singular form of \"blanco,\" agreeing with \"casa.\" Common mistake: English adjectives never change form (\"white house,\" \"white houses,\" \"white car\" — always \"white\"), so English speakers often forget Spanish adjectives have to match the noun's gender and number every time.",
        "casa": "The noun the adjective must agree with — feminine and singular." } },
    { topic: "Adjetivos · concordancia plural", sentence: "Compramos flores ___.", answer: "rojas", options: ["rojas", "rojo", "rojos", "roja"],
      translation: "We bought red flowers.",
      compare: [ { word: "rojos", note: "The masculine plural form — wrong here, since \"flores\" is feminine." },
                 { word: "roja", note: "The feminine singular form — wrong here, since \"flores\" is plural." } ],
      notes: { "__blank__": "\"Rojas\" is the feminine plural form of \"rojo,\" agreeing with \"flores,\" and it also sits after the noun. Common mistake: besides forgetting agreement, English speakers often put the adjective before the noun (\"red flowers\" word order), when the unmarked, default position in Spanish is after the noun.",
        "flores": "The noun the adjective must agree with — feminine and plural, and placed before its adjective here." } },
    { topic: "Adjetivos · posición especial", sentence: "Es un ___ libro.", answer: "buen", options: ["buen", "bueno", "buena", "buenos"],
      translation: "It's a good book.",
      compare: [ { word: "bueno", note: "The full form — correct AFTER a noun (\"un libro bueno\"), but shortened to \"buen\" when placed before a masculine singular noun." },
                 { word: "buena", note: "The feminine form — wrong here, since \"libro\" is masculine." } ],
      notes: { "__blank__": "\"Buen\" is the shortened form of \"bueno,\" used right before a masculine singular noun. Common mistake: this is a genuine exception to \"adjectives go after the noun\" — a handful of adjectives (bueno, malo, grande, primero, tercero, alguno, ninguno) both move before the noun and shorten in this position, which trips up learners who just memorized the general placement rule.",
        "libro": "The noun being described — masculine singular, which is why \"bueno\" shortens to \"buen\" in front of it." } },

    // ---------------- CONJUNCIONES ----------------
    { topic: "Conjunciones · y", sentence: "Compré manzanas ___ naranjas.", answer: "y", options: ["y", "e", "o", "u"],
      translation: "I bought apples and oranges.",
      compare: [ { word: "e", note: "The swapped form of \"y,\" used only right before a word starting with an i/hi sound — not needed here." },
                 { word: "o", note: "\"Or\" — a different coordinator entirely." } ],
      notes: { "__blank__": "\"Y\" is the basic word for \"and.\" It's one of the few Spanish conjunctions that changes shape depending on the sound that follows — see \"e\" for the swapped version." } },
    { topic: "Conjunciones · e", sentence: "Estudio historia ___ inglés.", answer: "e", options: ["e", "y", "o", "u"],
      translation: "I study history and English.",
      compare: [ { word: "y", note: "The normal \"and\" — correct everywhere except right before a word starting with the sound \"i\" or \"hi.\"" },
                 { word: "o", note: "\"Or\" — a different coordinator entirely." } ],
      notes: { "__blank__": "\"E\" replaces \"y\" whenever the next word starts with an \"i\" or \"hi\" sound (like \"inglés\"), purely to avoid an awkward \"y i\" sound. Common mistake: English \"and\" never changes shape, so English speakers almost always default to \"y\" here without realizing Spanish has this built-in swap rule." } },
    { topic: "Conjunciones · o", sentence: "¿Quieres té ___ café?", answer: "o", options: ["o", "u", "y", "e"],
      translation: "Do you want tea or coffee?",
      compare: [ { word: "u", note: "The swapped form of \"o,\" used only right before a word starting with an o/ho sound — not needed here." },
                 { word: "y", note: "\"And\" — a different coordinator entirely." } ],
      notes: { "__blank__": "\"O\" is the basic word for \"or.\" Like \"y,\" it has a swapped version (\"u\") used before certain sounds." } },
    { topic: "Conjunciones · u", sentence: "No sé si son siete ___ ocho.", answer: "u", options: ["u", "o", "y", "e"],
      translation: "I don't know if it's seven or eight.",
      compare: [ { word: "o", note: "The normal \"or\" — correct everywhere except right before a word starting with the sound \"o\" or \"ho.\"" },
                 { word: "y", note: "\"And\" — a different coordinator entirely." } ],
      notes: { "__blank__": "\"U\" replaces \"o\" whenever the next word starts with an \"o\" or \"ho\" sound (like \"ocho\"), for the same reason \"y\" becomes \"e.\" Common mistake: English speakers rarely expect a conjunction to change spelling based on the following word's sound at all, so this rule is easy to forget in both directions." } },
    { topic: "Conjunciones · pero", sentence: "Quiero ir a la playa, ___ no tengo tiempo.", answer: "pero", options: ["pero", "sino", "sino que", "aunque"],
      translation: "I want to go to the beach, but I don't have time.",
      compare: [ { word: "sino", note: "Only usable after a negative statement, to directly replace/correct it — not a simple contrast like this one." },
                 { word: "aunque", note: "\"Although\" — reframes the whole sentence as a concession rather than a straightforward contrast." } ],
      notes: { "__blank__": "\"Pero\" is the general-purpose \"but,\" used for a simple contrast. Common mistake: English has just one word, \"but,\" so English speakers use \"pero\" everywhere, missing that Spanish has a second, more specific word — \"sino\" — for a different kind of contrast (see the next two cards)." } },
    { topic: "Conjunciones · sino", sentence: "No es rojo, ___ azul.", answer: "sino", options: ["sino", "pero", "sino que", "porque"],
      translation: "It's not red, but rather blue.",
      compare: [ { word: "pero", note: "Would work for a general contrast, but here the second idea directly replaces/corrects the first — that specific pattern calls for \"sino.\"" },
                 { word: "sino que", note: "Used instead of \"sino\" when what follows has its own conjugated verb, not just a word or phrase." } ],
      notes: { "no": "The negative that makes \"sino\" possible — sino can only follow a negated first statement.",
        "__blank__": "\"Sino\" means \"but rather,\" used after a negative statement when the second part directly replaces or corrects the first (not X, but Y). Common mistake: English speakers use \"pero\" for this too since English \"but\" covers both jobs — Spanish specifically reserves \"sino\" for this correcting pattern." } },
    { topic: "Conjunciones · sino que", sentence: "No fue a la fiesta, ___ se quedó en casa.", answer: "sino que", options: ["sino que", "sino", "pero", "porque"],
      translation: "He didn't go to the party, but rather stayed home.",
      compare: [ { word: "sino", note: "Would be correct if what followed were just a word or phrase, not a fully conjugated verb like \"se quedó.\"" },
                 { word: "pero", note: "Would work for a general contrast, but misses the \"correcting\" nuance sino/sino que carry." } ],
      notes: { "no": "The negative that sets up the sino/sino que pattern.",
        "__blank__": "\"Sino que\" is used instead of plain \"sino\" specifically because what follows (\"se quedó en casa\") has its own conjugated verb. Common mistake: English speakers who've learned \"sino\" often forget to add \"que\" once a full clause with a verb follows." } },
    { topic: "Conjunciones · porque", sentence: "No fui a la fiesta ___ estaba enfermo.", answer: "porque", options: ["porque", "ya que", "como", "sino"],
      translation: "I didn't go to the party because I was sick.",
      compare: [ { word: "ya que", note: "Also means \"since/because,\" but is more common at the start of a sentence or in more formal contexts." },
                 { word: "como", note: "Also causal (\"since\"), but almost always placed at the very start of a sentence, unlike \"porque.\"" } ],
      notes: { "__blank__": "\"Porque\" is the default, all-purpose word for \"because,\" giving a straightforward reason. Common mistake: English speakers often reach for \"porque\" for every kind of \"because/since,\" not realizing Spanish has several causal connectors with different positioning rules (see \"como\" and \"ya que\")." } },
    { topic: "Conjunciones · como (causal)", sentence: "___ llovía, decidimos quedarnos en casa.", answer: "Como", options: ["Como", "Porque", "Ya que", "Aunque"],
      translation: "Since it was raining, we decided to stay home.",
      compare: [ { word: "Porque", note: "Also means \"because,\" but normally follows the result rather than opening the sentence this way." },
                 { word: "Ya que", note: "Also works at the start of a sentence with a very similar meaning, but is a bit more formal/emphatic than \"como.\"" } ],
      notes: { "__blank__": "\"Como\" here means \"since/as,\" a causal connector that specifically opens the sentence, with the result following. Common mistake: English speakers default to \"porque\" for every \"because/since,\" but \"porque\" sounds off at the very start of a sentence in this construction — \"como\" (or \"ya que\") is what a native speaker reaches for instead.",
        "llovía": "Imperfect of llover — describes the ongoing background condition (rain) that caused the decision." } },
    { topic: "Conjunciones · ya que", sentence: "___ ya sabes la respuesta, dímela.", answer: "Ya que", options: ["Ya que", "Porque", "Sino", "Aunque"],
      translation: "Since you already know the answer, tell me.",
      compare: [ { word: "Porque", note: "Also \"because,\" but typically follows the result rather than opening the sentence like this." },
                 { word: "Aunque", note: "\"Although\" — would introduce a concession, not a reason." } ],
      notes: { "__blank__": "\"Ya que\" means \"since/given that\" — a slightly more formal causal connector than \"como,\" and, unlike \"como,\" it can be used either at the start of the sentence or in the middle." } },
    { topic: "Conjunciones · aunque + indicativo", sentence: "Aunque llovió, fuimos al partido.", answer: "llovió", options: ["llovió", "llueva", "llovería", "lloviera"],
      translation: "Although it rained, we went to the game.",
      compare: [ { word: "llueva", note: "The subjunctive — would be used instead if the rain were still uncertain/hypothetical, not a known fact." },
                 { word: "lloviera", note: "The imperfect subjunctive — used for a past hypothetical, not a real, known past event." } ],
      notes: { "__blank__": "\"Llovió\" (indicative preterite) is used because the rain is a known, real fact — it already happened. Common mistake: English \"although\" doesn't change the verb form based on certainty, so English speakers often can't tell when aunque needs the indicative (known fact) versus the subjunctive (uncertain/hypothetical, see the next card)." } },
    { topic: "Conjunciones · aunque + subjuntivo", sentence: "Aunque ___ mañana, iremos al partido.", answer: "llueva", options: ["llueva", "llovió", "llovía", "lloverá"],
      translation: "Even if it rains tomorrow, we'll go to the game.",
      compare: [ { word: "llovió", note: "The indicative preterite — would treat the rain as an already-known fact, not a possible future one." },
                 { word: "lloverá", note: "The future indicative — states the rain as a confident prediction, removing the \"even if\" uncertainty aunque + subjunctive carries." } ],
      notes: { "__blank__": "\"Llueva\" (present subjunctive) is used because whether it rains tomorrow is still unknown/hypothetical. Common mistake: this indicative-vs-subjunctive switch after \"aunque\" has zero equivalent in English — \"even if it rains\" looks the same in English whether the rain is likely or not, but Spanish marks that uncertainty directly on the verb." } },
    { topic: "Conjunciones · cuando + subjuntivo", sentence: "Te llamaré cuando ___ a casa.", answer: "llegue", options: ["llegue", "llego", "llegué", "llegaba"],
      translation: "I'll call you when I get home.",
      compare: [ { word: "llego", note: "The present indicative — would describe a habitual action (\"when I [always] get home\"), not one specific future moment." },
                 { word: "llegué", note: "The preterite — would describe a completed past arrival, not a future one." } ],
      notes: { "__blank__": "\"Llegue\" (present subjunctive) is required because the arrival is a pending future action that hasn't happened yet. Common mistake: English says \"when I get home\" using the plain present tense, which strongly misleads English speakers into using the Spanish present indicative (llego) instead of the subjunctive here." } },
    { topic: "Conjunciones · cuando + indicativo", sentence: "Cuando ___ a casa, siempre ceno con mi familia.", answer: "llego", options: ["llego", "llegue", "llegué", "llegaría"],
      translation: "When I get home, I always have dinner with my family.",
      compare: [ { word: "llegue", note: "The subjunctive — would be used instead for a single pending future arrival, not a repeated habit." },
                 { word: "llegué", note: "The preterite — would describe one specific completed arrival in the past." } ],
      notes: { "siempre": "\"Always\" — signals a repeated habit, which is exactly why the indicative (not subjunctive) is used here.",
        "__blank__": "\"Llego\" (present indicative) is correct here because the sentence describes a repeated habit, not one pending future event. Common mistake: since the previous card and this one look almost identical in English (\"when I get home...\"), English speakers often can't tell that Spanish requires different moods depending on whether it's a one-time future event (subjunctive) or a routine (indicative)." } },
    { topic: "Conjunciones · mientras", sentence: "___ tú cocinas, yo pongo la mesa.", answer: "Mientras", options: ["Mientras", "Cuando", "Aunque", "Como"],
      translation: "While you cook, I'll set the table.",
      compare: [ { word: "Cuando", note: "\"When\" — implies one action follows or triggers another, not two things happening at the same time." },
                 { word: "Aunque", note: "\"Although\" — would introduce a concession, not simultaneous actions." } ],
      notes: { "__blank__": "\"Mientras\" means \"while,\" used for two actions happening at the same time." } },
    { topic: "Conjunciones · en cuanto", sentence: "En cuanto ___ el trabajo, saldremos.", answer: "termine", options: ["termine", "terminé", "terminaba", "terminaría"],
      translation: "As soon as we finish the work, we'll go out.",
      compare: [ { word: "terminé", note: "The preterite — would describe a completed past action, not a pending future one." },
                 { word: "terminaría", note: "The conditional — would express a hypothetical \"would finish,\" not a real pending event." } ],
      notes: { "__blank__": "\"Termine\" (present subjunctive) is required because \"en cuanto\" (as soon as) introduces a pending future action, in the same family as cuando + subjunctive. Common mistake: English \"as soon as we finish\" uses a plain present-looking verb, nudging English speakers toward the indicative instead of the required subjunctive." } },
    { topic: "Conjunciones · para que", sentence: "Te doy la llave para que ___ entrar.", answer: "puedas", options: ["puedas", "puedes", "podrás", "pudieras"],
      translation: "I'm giving you the key so that you can get in.",
      compare: [ { word: "puedes", note: "The indicative — would treat this as a plain statement rather than a purpose clause." },
                 { word: "podrás", note: "The future — would predict a future ability rather than express the purpose of giving the key." } ],
      notes: { "__blank__": "\"Puedas\" (present subjunctive) is required because \"para que\" always introduces a purpose clause with a different subject than the main clause (I give, so that YOU can). Common mistake: English speakers often confuse this with plain \"para + infinitive\" (used when the subject stays the same, like \"para entrar\" — \"in order to enter\"), forgetting that a subject change forces \"para que\" + subjunctive instead." } },
    { topic: "Conjunciones · antes de que", sentence: "Llama antes de que ___ de la oficina.", answer: "salga", options: ["salga", "sale", "salió", "saldrá"],
      translation: "Call before I leave the office.",
      compare: [ { word: "sale", note: "The indicative — \"antes de que\" never takes the indicative, regardless of certainty." },
                 { word: "salió", note: "The preterite — also indicative, and also incorrect after \"antes de que.\"" } ],
      notes: { "__blank__": "\"Salga\" (present subjunctive) is required because \"antes de que\" always takes the subjunctive, no matter how certain the event is. Common mistake: unlike \"cuando,\" which can be indicative or subjunctive depending on context, \"antes de que\" has no indicative option at all — a fixed rule English speakers sometimes over-apply the cuando pattern to." } },
    { topic: "Conjunciones · después de que", sentence: "Llamé después de que ___ la reunión.", answer: "terminó", options: ["terminó", "termine", "terminara", "terminaría"],
      translation: "I called after the meeting ended.",
      compare: [ { word: "termine", note: "The present subjunctive — would only be used for a pending future event, not a completed past one." },
                 { word: "terminara", note: "The imperfect subjunctive — used for past hypotheticals, not a real, known past event like this one." } ],
      notes: { "__blank__": "\"Terminó\" (indicative preterite) is correct because the meeting's ending is a completed, known past event. Common mistake: \"después de que\" behaves differently from \"antes de que\" — it takes the indicative for real past/habitual events, and only switches to subjunctive for pending future ones, a distinction English speakers often flatten since \"before/after\" don't change form in English." } },
    { topic: "Conjunciones · a menos que", sentence: "No iremos a menos que ___ el clima.", answer: "mejore", options: ["mejore", "mejora", "mejoró", "mejoraría"],
      translation: "We won't go unless the weather improves.",
      compare: [ { word: "mejora", note: "The indicative — \"a menos que\" always requires the subjunctive, regardless of likelihood." },
                 { word: "mejoraría", note: "The conditional — expresses a hypothetical \"would improve,\" not the required subjunctive form." } ],
      notes: { "__blank__": "\"Mejore\" (present subjunctive) is required because \"a menos que\" (unless) always introduces a hypothetical condition. Common mistake: like several other subordinating conjunctions here, \"a menos que\" has no indicative option — English speakers who default to the indicative after \"unless\" (since English doesn't change form) miss this every time." } },
    { topic: "Conjunciones · sin que", sentence: "Salió sin que nadie lo ___.", answer: "viera", options: ["viera", "vio", "ve", "verá"],
      translation: "He left without anyone seeing him.",
      compare: [ { word: "vio", note: "The indicative preterite — \"sin que\" always requires the subjunctive, not a plain factual past tense." },
                 { word: "ve", note: "The present indicative — also incorrect; \"sin que\" never takes the indicative." } ],
      notes: { "nadie": "\"Nobody\" — the subject of the subordinate clause; note that \"sin que\" plus a different subject is what forces this structure, versus plain \"sin + infinitive\" when the subject stays the same.",
        "__blank__": "\"Viera\" (imperfect subjunctive, matching the past-tense main verb \"salió\") is required because \"sin que\" always takes the subjunctive. Common mistake: English \"without anyone seeing him\" uses a plain -ing form with no mood distinction, so English speakers often don't expect Spanish to require a fully conjugated subjunctive verb here." } },

  const scoreEl = document.getElementById("score");
  const streakEl = document.getElementById("streak");
  const bestEl = document.getElementById("best");
  const categoryEl = document.getElementById("category");
  const promptEl = document.getElementById("prompt");
  const promptSubEl = document.getElementById("promptSub");
  const optionsEl = document.getElementById("options");
  const feedbackEl = document.getElementById("feedback");
  const nextBtn = document.getElementById("nextBtn");
  const speakBtn = document.getElementById("speakBtn");
  const progressEl = document.getElementById("progress");
  const filtersEl = document.getElementById("filters");
  const answerWrapEl = document.getElementById("answerWrap");
  const answerBubbleEl = document.getElementById("answerBubble");
  const explainCardEl = document.getElementById("explainCard");

  const GROUPS = ["Todos", ...Array.from(new Set(ITEMS.map(i => i.topic.split(" · ")[0])))];
  let activeGroup = "Todos";

  // ============== ADAPTIVE MASTERY TRACKING ==============
  // Each question gets a stable key. We track how many times in a row you've
  // gotten it right (correctStreak) and how many times you've seen it at all.
  // Questions with a high streak get picked much less often; brand-new
  // questions (timesSeen === 0) get boosted so they surface sooner.
  function itemKey(item) { return item.topic + "||" + item.sentence; }

  let itemStats = {};
  try { itemStats = JSON.parse(localStorage.getItem("charlemos_item_stats") || "{}"); } catch (e) { itemStats = {}; }

  function saveItemStats() {
    try { localStorage.setItem("charlemos_item_stats", JSON.stringify(itemStats)); } catch (e) { /* ignore quota errors */ }
  }

  function getStat(item) {
    const k = itemKey(item);
    if (!itemStats[k]) itemStats[k] = { correctStreak: 0, timesSeen: 0 };
    return itemStats[k];
  }

  function recordResult(item, wasCorrect) {
    const stat = getStat(item);
    stat.timesSeen += 1;
    stat.correctStreak = wasCorrect ? stat.correctStreak + 1 : 0;
    saveItemStats();
  }

  function masteryLabel(item) {
    const stat = getStat(item);
    if (stat.timesSeen === 0) return { icon: "🆕", text: "New" };
    if (stat.correctStreak >= 3) return { icon: "✅", text: `Mastered · ${stat.correctStreak} in a row` };
    if (stat.correctStreak >= 1) return { icon: "🔄", text: `Learning · ${stat.correctStreak} in a row` };
    return { icon: "🔁", text: "Needs review" };
  }

  // Weighted random pick: unseen questions and low-streak questions are much
  // more likely to be chosen; the immediately-previous question is heavily
  // suppressed so it doesn't repeat back-to-back.
  function pickWeighted(itemPool, avoidItem) {
    if (!itemPool.length) return null;
    const weights = itemPool.map(item => {
      const stat = getStat(item);
      let w = 1 / (1 + Math.min(stat.correctStreak, 6));
      if (stat.timesSeen === 0) w *= 5;
      if (avoidItem && item === avoidItem) w *= 0.05;
      return w;
    });
    const total = weights.reduce((a, b) => a + b, 0);
    let r = Math.random() * total;
    for (let i = 0; i < itemPool.length; i++) {
      r -= weights[i];
      if (r <= 0) return itemPool[i];
    }
    return itemPool[itemPool.length - 1];
  }

  let pool = [];
  let sessionCount = 0;
  let score = 0;
  let streak = 0;
  let best = Number(localStorage.getItem("charlemos_grammar_best") || 0);
  let current = null;
  let answered = false;

  bestEl.textContent = best;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function normalizeWord(w) {
    return w.toLowerCase().replace(/^[¿¡"'(\u00bf\u00a1]+|[?!.,;:"')]+$/g, "");
  }

  function renderFilters() {
    filtersEl.innerHTML = "";
    GROUPS.forEach(g => {
      const btn = document.createElement("button");
      btn.className = "filter-btn" + (g === activeGroup ? " active" : "");
      btn.type = "button";
      btn.textContent = g;
      btn.addEventListener("click", () => {
        activeGroup = g;
        renderFilters();
        resetPool();
        loadItem();
      });
      filtersEl.appendChild(btn);
    });
  }

  function resetPool() {
    pool = activeGroup === "Todos" ? ITEMS : ITEMS.filter(i => i.topic.startsWith(activeGroup));
    sessionCount = 0;
  }

  function loadItem() {
    answered = false;
    feedbackEl.innerHTML = "";
    feedbackEl.className = "feedback";
    nextBtn.classList.remove("show");
    answerWrapEl.classList.remove("show");
    answerBubbleEl.innerHTML = "";
    explainCardEl.classList.remove("show");
    explainCardEl.innerHTML = "";

    current = pickWeighted(pool, current);
    sessionCount += 1;
    const tag = masteryLabel(current);
    categoryEl.innerHTML = current.topic + '  <span style="font-family:\'Work Sans\',sans-serif;text-transform:none;letter-spacing:0;color:#9b9384;font-weight:500;">' + tag.icon + ' ' + tag.text + '</span>';

    const parts = current.sentence.split("___");
    promptEl.innerHTML = parts[0] + '<span class="blank-static">___</span>' + (parts[1] || "");
    promptSubEl.textContent = "Choose the word that correctly completes the sentence.";
    progressEl.textContent = `Question ${sessionCount} · ${pool.length} in "${activeGroup}" pool · repeats fade as you master them`;

    const choices = shuffle(current.options);
    optionsEl.innerHTML = "";
    choices.forEach(choice => {
      const btn = document.createElement("button");
      btn.className = "tile";
      btn.type = "button";
      btn.textContent = choice;
      btn.addEventListener("click", () => handleAnswer(btn, choice));
      optionsEl.appendChild(btn);
    });
  }

  function renderExplainCard(label, note, compareList) {
    let html = '<div class="lead"><b>' + label + '</b> — ' + note + '</div>';
    if (compareList && compareList.length) {
      html += '<div class="compare-title">Compare with</div><ul>';
      compareList.forEach(c => {
        html += '<li><b>' + c.word + '</b> — ' + c.note + '</li>';
      });
      html += '</ul>';
    }
    explainCardEl.innerHTML = html;

    const copyBtn = document.createElement("button");
    copyBtn.className = "copy-ai-btn";
    copyBtn.type = "button";
    copyBtn.textContent = "📋 Copy question for AI chat";
    copyBtn.addEventListener("click", () => copyForAI(label, note, compareList));
    explainCardEl.appendChild(copyBtn);

    const status = document.createElement("span");
    status.className = "copy-status";
    explainCardEl.appendChild(status);

    explainCardEl.classList.add("show");
  }

  function copyForAI(label, note, compareList) {
    const fullEs = current.sentence.replace("___", current.answer);
    let compareText = "";
    if (compareList && compareList.length) {
      compareText = " For comparison, I was also shown these related words: " +
        compareList.map(c => `"${c.word}" (${c.note})`).join("; ") + ".";
    }
    const text = `I'm learning Spanish. In the sentence "${fullEs}" (which means "${current.translation}"), can you explain in more depth why "${label}" is used here?\n\nWhat I already know: ${note}${compareText}\n\nCan you give me a deeper explanation, 2-3 more example sentences using it, and a common mistake English speakers make with this?`;

    const done = () => showCopyStatus("Copied! Paste it into Claude or any AI chat.");
    const failed = () => showCopyStatus("Couldn't copy automatically — press and hold the text above to copy it manually.");

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => legacyCopy(text, done, failed));
    } else {
      legacyCopy(text, done, failed);
    }
  }

  function legacyCopy(text, done, failed) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      ok ? done() : failed();
    } catch (e) {
      failed();
    }
  }

  function showCopyStatus(msg) {
    const status = explainCardEl.querySelector(".copy-status");
    if (!status) return;
    status.textContent = msg;
    setTimeout(() => { if (status) status.textContent = ""; }, 3500);
  }

  function onChunkClick(el, rawWord, isAnswerChunk) {
    answerBubbleEl.querySelectorAll(".chunk.selected").forEach(c => c.classList.remove("selected"));
    el.classList.add("selected");

    const cleanLabel = rawWord.replace(/[¿¡?!.,;:"'()]/g, "");
    const key = normalizeWord(rawWord);

    if (isAnswerChunk) {
      const note = current.notes["__blank__"] || "This is the target word for this exercise.";
      renderExplainCard(cleanLabel, note, current.compare);
      return;
    }

    let note = current.notes[key];
    let compareList = null;

    if (!note && GENERAL_NOTES[key]) {
      note = GENERAL_NOTES[key].note;
      compareList = GENERAL_NOTES[key].compare;
    }
    if (!note) {
      note = "This word carries the sentence's meaning but isn't the specific grammar focus of this exercise.";
    }

    renderExplainCard(cleanLabel, note, compareList);
  }

  function buildAnswerBubble() {
    answerBubbleEl.innerHTML = "";
    const parts = current.sentence.split("___");
    const beforeWords = parts[0].trim().split(/\s+/).filter(Boolean);
    const afterWords = (parts[1] || "").trim().split(/\s+/).filter(Boolean);

    beforeWords.forEach(w => {
      const chip = document.createElement("span");
      chip.className = "chunk";
      chip.textContent = w;
      chip.addEventListener("click", () => onChunkClick(chip, w, false));
      answerBubbleEl.appendChild(chip);
    });

    const answerChip = document.createElement("span");
    answerChip.className = "chunk is-answer";
    answerChip.textContent = current.answer;
    answerChip.addEventListener("click", () => onChunkClick(answerChip, current.answer, true));
    answerBubbleEl.appendChild(answerChip);

    afterWords.forEach(w => {
      const chip = document.createElement("span");
      chip.className = "chunk";
      chip.textContent = w;
      chip.addEventListener("click", () => onChunkClick(chip, w, false));
      answerBubbleEl.appendChild(chip);
    });
  }

  function handleAnswer(btn, choice) {
    if (answered) return;
    answered = true;
    const isCorrect = choice === current.answer;

    recordResult(current, isCorrect);

    [...optionsEl.children].forEach(tile => {
      tile.disabled = true;
      if (tile.textContent === current.answer) tile.classList.add("correct");
    });

    if (isCorrect) {
      btn.classList.add("correct");
      score += 10;
      streak += 1;
      feedbackEl.innerHTML = "¡Correcto!" + '<span class="translation">' + current.translation + '</span>';
      feedbackEl.classList.add("ok");
    } else {
      btn.classList.add("wrong");
      streak = 0;
      feedbackEl.innerHTML = `Not quite — the answer is <strong>${current.answer}</strong>.` + '<span class="translation">' + current.translation + '</span>';
      feedbackEl.classList.add("no");
    }

    if (score > best) {
      best = score;
      localStorage.setItem("charlemos_grammar_best", String(best));
    }

    scoreEl.textContent = score;
    streakEl.textContent = streak;
    bestEl.textContent = best;

    buildAnswerBubble();
    answerWrapEl.classList.add("show");
    nextBtn.classList.add("show");
  }

  function speakCurrent() {
    if (!current) return;
    if (!("speechSynthesis" in window)) return;
    const fullSentence = current.sentence.replace("___", current.answer);
    const utter = new SpeechSynthesisUtterance(fullSentence);
    utter.lang = "es-ES";
    utter.rate = 0.9;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
  }

  nextBtn.addEventListener("click", () => { loadItem(); });
  speakBtn.addEventListener("click", speakCurrent);

  renderFilters();
  resetPool();
  loadItem();

  // ============== MODE TOGGLE ==============
  const modeQuizBtn = document.getElementById("modeQuizBtn");
  const modeSpeakBtn = document.getElementById("modeSpeakBtn");
  const quizSection = document.getElementById("quizSection");
  const speakingSection = document.getElementById("speakingSection");

  modeQuizBtn.addEventListener("click", () => {
    modeQuizBtn.classList.add("active");
    modeSpeakBtn.classList.remove("active");
    quizSection.style.display = "";
    speakingSection.style.display = "none";
  });
  modeSpeakBtn.addEventListener("click", () => {
    modeSpeakBtn.classList.add("active");
    modeQuizBtn.classList.remove("active");
    speakingSection.style.display = "";
    quizSection.style.display = "none";
    if (!speakInitialized) initSpeaking();
  });

  // ============== SPEAKING PRACTICE ==============
  const speakFiltersEl = document.getElementById("speakFilters");
  const speakCategoryEl = document.getElementById("speakCategory");
  const speakTargetEl = document.getElementById("speakTarget");
  const speakTranslationEl = document.getElementById("speakTranslation");
  const speakHearBtn = document.getElementById("speakHearBtn");
  const speakRecordBtn = document.getElementById("speakRecordBtn");
  const speakResultEl = document.getElementById("speakResult");
  const speakNextBtn = document.getElementById("speakNextBtn");
  const speakProgressEl = document.getElementById("speakProgress");

  let speakInitialized = false;
  let speakActiveGroup = "Todos";
  let speakPool = [];
  let speakSessionCount = 0;
  let speakCurrentItem = null;
  let recognition = null;
  let isListening = false;

  const SpeechRecognitionClass = window.SpeechRecognition || window.webkitSpeechRecognition;

  function initSpeaking() {
    speakInitialized = true;
    renderSpeakFilters();
    resetSpeakPool();

    if (!SpeechRecognitionClass) {
      speakRecordBtn.style.display = "none";
      const warn = document.createElement("div");
      warn.className = "speak-unsupported";
      warn.textContent = "Your browser doesn't support speech recognition (this needs Chrome, Edge, or Safari on iOS 14.5+ with microphone access). You can still use \"Hear it first\" to practice listening and reading aloud on your own.";
      speakResultEl.parentElement.insertBefore(warn, speakResultEl);
    }

    loadSpeakItem();
  }

  function renderSpeakFilters() {
    speakFiltersEl.innerHTML = "";
    GROUPS.forEach(g => {
      const btn = document.createElement("button");
      btn.className = "filter-btn" + (g === speakActiveGroup ? " active" : "");
      btn.type = "button";
      btn.textContent = g;
      btn.addEventListener("click", () => {
        speakActiveGroup = g;
        renderSpeakFilters();
        resetSpeakPool();
        loadSpeakItem();
      });
      speakFiltersEl.appendChild(btn);
    });
  }

  function resetSpeakPool() {
    speakPool = speakActiveGroup === "Todos" ? ITEMS : ITEMS.filter(i => i.topic.startsWith(speakActiveGroup));
    speakSessionCount = 0;
  }

  function loadSpeakItem() {
    speakCurrentItem = pickWeighted(speakPool, speakCurrentItem);
    speakSessionCount += 1;
    const tag = masteryLabel(speakCurrentItem);
    speakCategoryEl.innerHTML = speakCurrentItem.topic + '  <span style="font-family:\'Work Sans\',sans-serif;text-transform:none;letter-spacing:0;color:#9b9384;font-weight:500;">' + tag.icon + ' ' + tag.text + '</span>';
    const fullEs = speakCurrentItem.sentence.replace("___", speakCurrentItem.answer);
    speakTargetEl.textContent = fullEs;
    speakTranslationEl.textContent = speakCurrentItem.translation;
    speakProgressEl.textContent = `Sentence ${speakSessionCount} · ${speakPool.length} in "${speakActiveGroup}" pool · repeats fade as you master them`;
    speakResultEl.innerHTML = "";
  }

  function speakHearTarget() {
    if (!speakCurrentItem) return;
    if (!("speechSynthesis" in window)) return;
    const fullEs = speakCurrentItem.sentence.replace("___", speakCurrentItem.answer);
    const utter = new SpeechSynthesisUtterance(fullEs);
    utter.lang = "es-ES";
    utter.rate = 0.85;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
  }

  function stripAccents(s) {
    return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  function normalizeForSpeech(s) {
    return stripAccents(s.toLowerCase())
      .replace(/[¿¡?!.,;:"'()]/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function scoreTranscript(target, transcript) {
    const targetWords = normalizeForSpeech(target).split(" ").filter(Boolean);
    const saidWords = normalizeForSpeech(transcript).split(" ").filter(Boolean);
    const saidCounts = {};
    saidWords.forEach(w => { saidCounts[w] = (saidCounts[w] || 0) + 1; });

    const wordResults = targetWords.map(w => {
      if (saidCounts[w] > 0) {
        saidCounts[w] -= 1;
        return { word: w, ok: true };
      }
      return { word: w, ok: false };
    });

    const matched = wordResults.filter(w => w.ok).length;
    const pct = targetWords.length ? Math.round((matched / targetWords.length) * 100) : 0;
    return { pct, wordResults };
  }

  function renderSpeakResult(transcript, pct, wordResults) {
    let scoreClass = "retry";
    let scoreLabel = "Keep practicing — try again";
    if (pct >= 90) { scoreClass = "great"; scoreLabel = "Excellent match!"; }
    else if (pct >= 70) { scoreClass = "close"; scoreLabel = "Close — check the words below"; }

    let html = '<div class="transcript"><span class="say-label">What we heard</span>' + (transcript || "(nothing captured)") + '</div>';
    html += '<div class="speak-score ' + scoreClass + '">' + scoreLabel + ' — ' + pct + '% word match</div>';
    html += '<div class="word-diff">';
    wordResults.forEach(w => {
      html += '<span class="' + (w.ok ? "match" : "miss") + '">' + w.word + '</span>';
    });
    html += '</div>';
    speakResultEl.innerHTML = html;
  }

  function startListening() {
    if (!SpeechRecognitionClass || !speakCurrentItem) return;
    if (isListening) {
      recognition && recognition.stop();
      return;
    }

    recognition = new SpeechRecognitionClass();
    recognition.lang = "es-ES";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    isListening = true;
    speakRecordBtn.classList.add("listening");
    speakRecordBtn.textContent = "🔴 Listening...";

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      const fullEs = speakCurrentItem.sentence.replace("___", speakCurrentItem.answer);
      const { pct, wordResults } = scoreTranscript(fullEs, transcript);
      renderSpeakResult(transcript, pct, wordResults);
      recordResult(speakCurrentItem, pct >= 85);
    };

    recognition.onerror = (event) => {
      speakResultEl.innerHTML = '<div class="speak-score retry">Couldn\'t capture audio (' + event.error + '). Check microphone permissions and try again.</div>';
    };

    recognition.onend = () => {
      isListening = false;
      speakRecordBtn.classList.remove("listening");
      speakRecordBtn.textContent = "🎤 Start speaking";
    };

    try {
      recognition.start();
    } catch (e) {
      isListening = false;
      speakRecordBtn.classList.remove("listening");
      speakRecordBtn.textContent = "🎤 Start speaking";
    }
  }

  speakHearBtn.addEventListener("click", speakHearTarget);
  speakRecordBtn.addEventListener("click", startListening);
  speakNextBtn.addEventListener("click", () => { loadSpeakItem(); });
</script>

</body>
</html>
